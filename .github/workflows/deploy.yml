name: Deploy

# GitOps: an environment's desired state is environments/<env>.bicepparam (image tag,
# SKU, base URL). Merging a change to it, or to infra/, deploys that environment.
on:
  push:
    branches: [main]
    paths: [infra/**, environments/**]
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy
        required: true
        default: test
        type: choice
        options: [test]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # Skipped until the Azure environment is set up (see README).
    if: vars.AZURE_RESOURCE_GROUP != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.env || 'test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure and app
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "sc-${{ github.run_id }}" \
            --parameters "environments/${{ inputs.env || 'test' }}.bicepparam" \
            --parameters smtpPassword="$SMTP_PASSWORD" \
            --query properties.outputs -o json
