name: Build image

on:
  push:
    branches: [main]
    paths: [Dockerfile, package.json, package-lock.json, config/**, templates/**, docker/**, .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, package.json, package-lock.json, config/**, templates/**, docker/**, .github/workflows/image.yml]
  workflow_dispatch:
    inputs:
      css_repo:
        description: CSS git repository to build from (default is the Dockerfile's)
        required: false
      css_ref:
        description: CSS commit to build (default is the Dockerfile's)
        required: false
      tag:
        description: Extra image tag for this build (e.g. hotfixes-abc123); main is only updated when empty
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The test environment holds the Azure login used to push to the test registry.
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/login@v2
        if: github.event_name != 'pull_request' && vars.AZURE_ACR != ''
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to the Azure registry
        if: github.event_name != 'pull_request' && vars.AZURE_ACR != ''
        run: az acr login -n "${{ vars.AZURE_ACR }}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            ${{ inputs.css_repo && format('CSS_REPO={0}', inputs.css_repo) || '' }}
            ${{ inputs.css_ref && format('CSS_REF={0}', inputs.css_ref) || '' }}
          tags: |
            ${{ !inputs.tag && format('ghcr.io/{0}:{1}', github.repository, github.sha) || '' }}
            ${{ !inputs.tag && format('ghcr.io/{0}:main', github.repository) || '' }}
            ${{ !inputs.tag && vars.AZURE_ACR != '' && format('{0}.azurecr.io/solidcommunity-gitops:{1}', vars.AZURE_ACR, github.sha) || '' }}
            ${{ !inputs.tag && vars.AZURE_ACR != '' && format('{0}.azurecr.io/solidcommunity-gitops:main', vars.AZURE_ACR) || '' }}
            ${{ inputs.tag && vars.AZURE_ACR != '' && format('{0}.azurecr.io/solidcommunity-gitops:{1}', vars.AZURE_ACR, inputs.tag) || '' }}
      - name: Smoke test
        run: |
          docker build -t sc-smoke ${{ inputs.css_repo && format('--build-arg CSS_REPO={0}', inputs.css_repo) || '' }} ${{ inputs.css_ref && format('--build-arg CSS_REF={0}', inputs.css_ref) || '' }} .
          docker run -d --name sc -p 3000:3000 -e CSS_BASE_URL=http://localhost:3000/ -e CSS_ROOT_FILE_PATH=/tmp/data sc-smoke
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/.well-known/openid-configuration >/dev/null && break; sleep 2; done
          curl -fsS http://localhost:3000/.well-known/openid-configuration >/dev/null || { docker logs sc; exit 1; }
          curl -fsS -H 'Accept: text/html' http://localhost:3000/ | grep -q 'id="acceptable-use"' || { echo "Landing page not served at the root"; exit 1; }
          curl -fsS http://localhost:3000/.well-known/sc/site.css >/dev/null || { echo "Site stylesheet not served"; exit 1; }
          # Any other HTML request gets Mashlib (here a 401 for a resource that does not exist, so no -f).
          curl -sS -H 'Accept: text/html' http://localhost:3000/smoke-test/ | grep -q mashlib || { echo "Mashlib not served as default UI"; exit 1; }
